{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Django</title>
  <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
  <header>
    <h1>Hola desde Django 🐍</h1>
    <p id="team">Cargando...</p>
  </header>

  <main>
    <div class="card">
      <h2>Integrantes</h2>
      <ul id="members"></ul>
    </div>

    <div class="card">
      <h2>Información del despliegue</h2>
      <p><strong>Servidor web:</strong> <span id="web_server">-</span></p>
      <p><strong>Stack:</strong> <span id="stack">-</span></p>
      <p><strong>Hora del servidor:</strong> <span id="server_time">-</span></p>
      <p><strong>Tu IP:</strong> <span id="client_ip">-</span></p>
      <button id="refresh">Actualizar datos</button>
    </div>

    <p id="error" class="error" hidden></p>
  </main>

  <footer>Python + Virtualenv + GitHub + Actions + Nginx</footer>

  <script src="{% static 'core/app.js' %}"></script>
</body>
</html>
